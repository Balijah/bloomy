name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck, Test, Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Verify fresh and existing-database migrations
        run: node scripts/test-migrations.mjs
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Build
        run: pnpm run build:deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  audit:
    name: Dependency Audit (no new high/critical findings)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test audit validation
        run: node --test scripts/check-audit.test.mjs

      - name: Reject new high/critical dependency findings
        run: node scripts/check-audit.mjs
